name: Daytrader market-hours health check

on:
  schedule:
    # UTC: 12:03-21:58 on weekdays, covering US standard and daylight time.
    # Starts at 17:33 IST, ahead of the October 26 19:00 IST opening.
    - cron: '3-58/5 12-21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/daytrader-health.yml']

permissions:
  contents: read

concurrency:
  group: daytrader-health
  cancel-in-progress: false

jobs:
  check:
    # Standard hosted runner is free on this public repository. Never use
    # larger/paid runners. No Alpaca trading credentials are used; email and
    # read-only dashboard access are provided only through encrypted secrets.
    if: github.repository == 'Parthivcodes/daytrader.gpt' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore notification checkpoint
        id: notification-cache
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: daytrader-notifications-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daytrader-notifications-v1-
      - name: Wake service and verify paper runner
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = 'https://hermestradingsystem.onrender.com/healthz'
          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Daytrader-Health-Monitor/1.0'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      status = json.load(response)
                  assert status.get('service') == 'Daytrader', 'Unexpected service'
                  assert status.get('hosting') == 'Render Free', 'Unexpected hosting configuration'
                  assert status.get('capital_limit') == 5000, 'Capital limit mismatch'
                  assert status.get('planned_risk_limit') == 100, 'Risk limit mismatch'
                  assert status.get('runner_process') == 'running', 'Paper runner not running'
                  assert status.get('entries_enabled') is True, 'Automatic entries are paused'
                  print('Daytrader responded; paper runner alive; capital/risk configuration verified.')
                  print('Public health check only: does not verify broker connectivity or submit orders.')
                  break
              except Exception as error:
                  print('Health attempt', attempt + 1, 'failed:', type(error).__name__)
                  if attempt == 2:
                      raise SystemExit('Daytrader health check failed. Review private Render logs.')
                  time.sleep(10)
          PY
      - name: Email confirmed fills and market-hours incidents
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DAYTRADER_DASHBOARD_PASSWORD: ${{ secrets.DAYTRADER_DASHBOARD_PASSWORD }}
        run: python scripts/email_monitor.py
      - name: Save notification checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: daytrader-notifications-v1-${{ github.run_id }}-${{ github.run_attempt }}
