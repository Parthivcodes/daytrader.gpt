services:
  - type: worker
    name: alpaca-paper-daytrader
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -p test_standalone.py
    startCommand: python -u trader/standalone/runner.py
    disk:
      name: paper-trader-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER_TRADE
        value: "true"
      - key: TRADER_CLOUD
        value: "true"
      - key: TRADER_STATE_DIR
        value: /var/data/trader
      - key: TRADER_DISK_MOUNT
        value: /var/data
      - key: PAPER_ENTRIES_ENABLED
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
